<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Welcome | UniFit</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3e2723;
            font-family: Arial, sans-serif;
        }

        .welcome-screen {
            text-align: center;
            color: white;
            padding: 30px;
        }

        .welcome-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: welcomePulse 1.2s ease-in-out infinite alternate;
        }

        .welcome-screen h1 {
            font-size: 38px;
            margin: 0 0 10px;
        }

        .welcome-screen p {
            color: #dfbb8b;
            font-size: 17px;
            margin: 0;
        }

        @keyframes welcomePulse {
            from {
                transform: scale(0.95);
            }

            to {
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>

    <main class="welcome-screen">

        <img
            src="assets/images/Group 6.png"
            alt="UniFit Logo"
            class="welcome-logo">

        <h1 id="welcomeMessage">
            Welcome to UniFit!
        </h1>

        <p>
            Your School Essentials, One Click Away.
        </p>

    </main>


    <script>

        let currentUser = null;

        try {

            currentUser =
                JSON.parse(
                    localStorage.getItem(
                        "unifitCurrentUser"
                    )
                );

        } catch (error) {

            currentUser = null;

        }


        const welcomeMessage =
            document.getElementById(
                "welcomeMessage"
            );


        if (
            currentUser &&
            currentUser.firstName
        ) {

            welcomeMessage.textContent =
                "Welcome, " +
                currentUser.firstName +
                "!";

        }


        setTimeout(
            function () {

                window.location.href =
                    "index.html";

            },
            1500
        );

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Admins | UniFit</title><link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
<header class="admin-header"><a href="../index.html" class="admin-logo"><img src="../assets/images/Group 6.png" alt="UniFit Logo"><div><strong>UniFit</strong><span>Admin Panel</span></div></a><div class="admin-header-actions"><span class="admin-name">Administrator</span><button type="button" class="btn admin-logout-button">Logout</button></div></header>
<div class="admin-layout">
<aside class="admin-sidebar"><nav class="admin-navigation"><a href="dashboard.html">Dashboard</a><a href="orders.html">Orders</a><a href="products.html">Products</a><a href="uniform-sets.html">Uniform Sets</a><a href="sportsfest.html">Sportsfest</a><a href="students.html">Students</a><a href="register_A.html" class="active" data-main-admin-only>Manage Admins</a></nav></aside>
<main class="admin-main">
<div class="admin-page-heading"><div><p class="eyebrow">Main Admin Only</p><h1>Manage Admin Accounts</h1><p>Create or deactivate sub-admin access.</p></div></div>
<section class="admin-dashboard-section"><div class="admin-section-heading"><h2>Create Sub-Admin</h2></div>
<form id="subAdminForm" class="admin-account-form">
<div class="form-group"><label for="subAdminName">Full Name</label><input id="subAdminName" type="text" required></div>
<div class="form-group"><label for="subAdminEmail">Email</label><input id="subAdminEmail" type="email" required></div>
<div class="form-group"><label for="subAdminPassword">Password</label><input id="subAdminPassword" type="password" minlength="8" required></div>
<div class="form-group"><label for="subAdminConfirm">Confirm Password</label><input id="subAdminConfirm" type="password" minlength="8" required></div>
<div class="full-width"><button type="submit" class="btn primary-btn">Create Sub-Admin</button><p id="adminFormMessage" class="admin-form-message" aria-live="polite"></p></div>
</form></section>
<section class="admin-dashboard-section"><div class="admin-section-heading"><h2>Administrator Accounts</h2></div><div class="admin-table-wrapper"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminAccountsTable"></tbody></table></div></section>
</main></div>
<script src="../js/admin-auth.js"></script><script src="../js/admin-management.js"></script>
</body></html>

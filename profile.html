<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | UniFit</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <nav class="navbar">

            <!-- LOGO -->
            <a href="index.html"
               class="logo">

                <img
                    src="assets/images/Group 6.png"
                    alt="UniFit Logo">

                <span>
                    UniFit
                </span>

            </a>


            <!-- MOBILE MENU -->
            <button
                class="menu-toggle"
                id="menuToggle"
                type="button">

                Menu

            </button>


            <!-- NAVIGATION -->
            <ul class="nav-links"
                id="navLinks">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="products.html">
                        Products
                    </a>
                </li>

                <li>
                    <a href="uniform-sets.html">
                        Uniform Sets
                    </a>
                </li>

                <li>
                    <a href="sportfest-uniform.html">
                        Sportsfest
                    </a>
                </li>

                <li>
                    <a href="size-guide.html">
                        Size Guide
                    </a>
                </li>

                <li>
                    <a href="cart.html">

                        Cart

                        <span class="cart-count">
                            0
                        </span>

                    </a>
                </li>

                <li>
                    <a href="login.html">
                        Login
                    </a>
                </li>

                <li>
                    <a href="profile.html"
                       class="active">

                        Profile

                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- =====================================================
         PROFILE PAGE
    ====================================================== -->

    <main>

        <section class="section">

            <div class="profile-container">


                <!-- PROFILE HEADER -->
                <div class="profile-header">

                    <div
                        class="profile-avatar"
                        id="profileAvatar">

                        U

                    </div>


                    <div>

                        <p class="eyebrow">
                            My Account
                        </p>

                        <h1 id="profileFullName">
                            Student Profile
                        </h1>

                        <p>
                            Manage your UniFit account information.
                        </p>

                    </div>

                </div>



                <!-- =================================================
                     PERSONAL INFORMATION
                ================================================== -->

                <div class="profile-card">

                    <h2>
                        Personal Information
                    </h2>


                    <div class="profile-info-grid">


                        <!-- FULL NAME -->
                        <div class="profile-info-item">

                            <span>
                                Full Name
                            </span>

                            <strong id="profileName">
                                Not Available
                            </strong>

                        </div>



                        <!-- CONTACT NUMBER -->
                        <div class="profile-info-item">

                            <span>
                                Contact Number
                            </span>

                            <strong id="profileContact">
                                Not Available
                            </strong>

                        </div>



                        <!-- EMAIL -->
                        <div class="profile-info-item">

                            <span>
                                Email Address
                            </span>

                            <strong id="profileEmail">
                                Not Available
                            </strong>

                        </div>


                    </div>



                    <!-- =================================================
                         ACTIONS
                    ================================================== -->

                    <div class="profile-actions">


                        <a
                            href="my-orders.html"
                            class="btn primary-btn">

                            My Orders

                        </a>


                        <button
                    type="button"
                    class="btn secondary-btn"
                    id="logoutButton"
                    onclick="
                        localStorage.removeItem('unifitLoggedIn');
                        localStorage.removeItem('unifitCurrentUser');
                        window.location.href='login.html';
                    ">

                    Logout

                </button>


                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/app.js"></script>


</body>

</html>
